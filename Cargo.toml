[package]
name = "odin-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Nate Walker <@nwalker85>"]
description = "Odin OS: Sovereign Capability Microkernel & Wordline Gated Silicon Runtime"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
ed25519-compact = { version = "2.6.0", default-features = false, features = ["opt_size"] }

[dev-dependencies]
proptest = "1.6"
