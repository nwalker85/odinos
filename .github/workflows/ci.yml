name: Odin OS Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Canonical Verification Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc qemu-system-riscv z3 python3 python3-pip

      - name: Install Typst CLI
        run: |
          TYPST_VERSION="0.11.1"
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ --strip-components=1
          sudo mv typst /usr/local/bin/

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf, x86_64-unknown-linux-gnu

      - name: Install Python Requirements
        run: |
          pip install pynacl --break-system-packages

      - name: Microkernel Compilation (riscv64gc)
        run: cargo build --release --target riscv64gc-unknown-none-elf

      - name: Host Unit Tests
        run: cargo test --lib --target x86_64-unknown-linux-gnu

      - name: Formal SMT Verification (Z3)
        run: |
          z3 formal/deed_bounds_verification.smt2 | grep -q "unsat"
          z3 formal/sequence_anti_replay.smt2 | grep -q "unsat"

      - name: QEMU Adversarial Matrix Execution
        run: cargo run --release

      - name: Authority Isolation Unit Suite
        run: python3 -m unittest tests/test_authority_isolation.py

      - name: Adversarial Verifier Unit Suite
        run: python3 -m unittest tests/test_evidence_verifier_adversarial.py

      - name: Layer B External Evidence Verifier
        run: python3 tools/verify_evidence.py

      - name: Canonical Release Verification Pipeline
        run: python3 tools/verify_release.py
