name: "Feature / Architectural RFC"
description: "Propose an architectural change, physical silicon target, or Phase C extension."
title: "[RFC]: <Short title of architectural proposal>"
labels: ["enhancement", "rfc"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or architectural limitation does this proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Detailed architectural design or implementation strategy.
    validations:
      required: true

  - type: textarea
    id: impact_on_invariants
    attributes:
      label: Impact on Security Invariants
      description: Does this change impact the #![no_std] zero-allocation rule, PMP bounds, or formal SMT correspondence?
    validations:
      required: true
