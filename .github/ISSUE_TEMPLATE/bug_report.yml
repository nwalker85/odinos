name: "Bug Report"
description: "Report an unexpected crash, build failure, or simulation anomaly."
title: "[Bug]: <Short description of issue>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands to reproduce the issue.
      placeholder: |
        1. `cargo build --release --target riscv64gc-unknown-none-elf`
        2. See compilation error...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS, toolchain, and emulator versions.
      value: |
        - Host OS:
        - rustc --version:
        - qemu-system-riscv64 --version:
        - z3 --version:
    validations:
      required: true
